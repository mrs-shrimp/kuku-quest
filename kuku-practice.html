<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九九とっくんのへや</title>
<style>
:root{--cream:#FFF9EC;--ink:#2F3A4A;--sky:#5BC0EB;--mint:#3DCBA0;--sun:#FFD23F;--org:#FF9F43;--cor:#FF6B6B;--card:#fff;--sh:0 6px 0 rgba(47,58,74,.08),0 10px 24px rgba(47,58,74,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(#DFF4FF,var(--cream) 40%);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.screen{display:none;animation:in .3s ease}.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px) scale(.98)}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:16px}
.hdr{display:flex;align-items:center;gap:12px}
.mascot{position:relative;width:76px;height:70px;flex:none;animation:bob 2.4s ease-in-out infinite}
.mascot i{position:absolute;inset:6px 0 0;background:var(--sun);border-radius:50% 50% 46% 46%;box-shadow:inset 0 -8px 0 rgba(255,159,67,.35)}
.mascot b{position:absolute;top:0;width:22px;height:26px;background:var(--org);border-radius:50%}
.mascot b:nth-child(1){left:6px;transform:rotate(-18deg)}.mascot b:nth-child(2){right:6px;transform:rotate(18deg)}
.mascot u{position:absolute;top:32px;width:9px;height:11px;background:var(--ink);border-radius:50%}
.mascot u:nth-of-type(1){left:22px}.mascot u:nth-of-type(2){right:22px}
.mascot s{position:absolute;left:50%;top:46px;width:16px;height:8px;margin-left:-8px;border-bottom:3px solid var(--ink);border-radius:0 0 16px 16px}
.mascot em{position:absolute;top:44px;width:10px;height:6px;background:var(--cor);opacity:.5;border-radius:50%}
.mascot em:nth-of-type(1){left:10px}.mascot em:nth-of-type(2){right:10px}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{margin:0;font-size:1.5rem;letter-spacing:.04em}.sub{margin:2px 0 0;font-size:.85rem;opacity:.7}
.lv{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.lv span:first-child{font-size:1.3rem}
.bar{height:16px;background:#E8EEF3;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.start{display:block;width:100%;margin:16px 0;padding:22px 16px;border-radius:28px;background:linear-gradient(135deg,var(--org),var(--cor));color:#fff;font-size:1.5rem;font-weight:800;box-shadow:0 8px 0 #D9534F,0 14px 24px rgba(255,107,107,.35);animation:pulse 2s ease-in-out infinite}
.start small{display:block;font-size:.9rem;font-weight:600;opacity:.95;margin-top:4px}
.start:active{box-shadow:0 3px 0 #D9534F}
@keyframes pulse{50%{transform:scale(1.025)}}
.mission{display:flex;align-items:center;gap:10px;background:#FFF3C4;border-radius:18px;padding:12px 14px;font-weight:700}
.sec{margin:20px 4px 8px;font-weight:800;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dan{position:relative;padding:14px 4px;border-radius:20px;background:var(--card);box-shadow:var(--sh);font-weight:800;font-size:1.5rem}
.dan small{display:block;font-size:.75rem;font-weight:600;opacity:.7}
.dan .st{display:block;font-size:.8rem;min-height:1.1em;color:var(--org)}
.dan.lock{filter:grayscale(1);opacity:.5}
.dan.done{background:#E6FAF3}
.dan:nth-child(3n+1){border-top:6px solid var(--sky)}.dan:nth-child(3n+2){border-top:6px solid var(--mint)}.dan:nth-child(3n){border-top:6px solid var(--org)}
.tip{margin-top:20px;font-size:.8rem;opacity:.65;text-align:center}
/* quiz */
.top{display:flex;align-items:center;gap:8px}
.back{background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;box-shadow:var(--sh)}
.dots{flex:1;display:flex;gap:4px}.dots i{flex:1;height:10px;border-radius:9px;background:#E1E8EE;transition:background .3s}.dots i.d{background:var(--mint)}.dots i.c{background:var(--sun)}
.chip{background:#fff;border-radius:99px;padding:6px 12px;font-weight:800;box-shadow:var(--sh);white-space:nowrap}
.q{margin-top:16px;text-align:center;position:relative;overflow:hidden}
.kana{min-height:1.6em;font-size:1.25rem;font-weight:700;color:var(--sky)}
.eq{font-size:clamp(3rem,16vw,4.6rem);font-weight:900;line-height:1.2;margin:4px 0}
.eq.ok{color:var(--mint);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.eq.ng{color:var(--cor);animation:shake .4s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.spk{background:var(--sky);color:#fff;border-radius:99px;padding:10px 20px;font-weight:800;box-shadow:0 5px 0 #3A9CC7}
.ans{margin:14px auto 0;width:150px;height:76px;line-height:76px;border:4px dashed #C9D6E0;border-radius:20px;font-size:2.8rem;font-weight:900}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pad button{height:68px;border-radius:20px;background:#fff;box-shadow:0 5px 0 #CFD9E2;font-size:2rem;font-weight:800}
.pad button.clr{background:#FFE3E3;box-shadow:0 5px 0 #F3BDBD;font-size:1.2rem}
.pad button:active{box-shadow:0 1px 0 #CFD9E2}
.combo{position:absolute;right:12px;top:10px;font-weight:900;color:var(--org);opacity:0;transform:scale(.5)}
.combo.show{animation:cb .9s ease}
@keyframes cb{20%{opacity:1;transform:scale(1.3) rotate(-6deg)}80%{opacity:1;transform:scale(1)}100%{opacity:0}}
/* result */
.res{text-align:center;padding-top:12px}
.chest{font-size:5rem;animation:bob 1.6s infinite}
.big{font-size:2.6rem;font-weight:900;color:var(--mint)}
.btn{display:block;width:100%;margin-top:12px;padding:16px;border-radius:22px;background:var(--sky);color:#fff;font-weight:800;font-size:1.2rem;box-shadow:0 6px 0 #3A9CC7}
.btn.alt{background:#fff;color:var(--ink);box-shadow:var(--sh)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,0) scale(.6);background:#fff;border-radius:28px;padding:18px 28px;font-size:1.6rem;font-weight:900;color:var(--org);box-shadow:var(--sh);opacity:0;z-index:60;text-align:center;pointer-events:none}
#toast.show{animation:tt 1.8s ease}
@keyframes tt{12%{opacity:1;transform:translate(-50%,0) scale(1.15)}25%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.chipR{display:flex;justify-content:space-between;align-items:center;margin:12px 0 0}
.coin{background:#FFF3C4;border-radius:99px;padding:8px 16px;font-weight:900;font-size:1.2rem;box-shadow:var(--sh)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.two button{padding:18px 8px;border-radius:22px;font-weight:800;font-size:1.15rem;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.mode{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:20px;background:#fff;box-shadow:var(--sh);font-weight:800;font-size:1.1rem;width:100%;margin-bottom:10px;border-left:8px solid var(--sky)}
.mode.m1{border-color:var(--mint)}.mode.m2{border-color:var(--sun)}
.mode span{font-size:2rem}.mode small{display:block;font-weight:600;font-size:.8rem;opacity:.65}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 2px;white-space:nowrap}
.tab{padding:10px 16px;border-radius:99px;background:#fff;font-weight:800;box-shadow:var(--sh)}.tab.on{background:var(--sky);color:#fff}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.it{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:12px;text-align:center}
.it .em{font-size:3rem}.it b{display:block}.it span{display:block;font-size:.8rem;opacity:.7;margin-bottom:6px}
.it.bd .em,.pi.bd{background:radial-gradient(#FFF6C9,#FFD23F);border-radius:50%;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--org)}
.it.bd .em{width:68px;height:68px;line-height:68px;margin:6px auto;font-size:2.2rem}
.buy{width:100%;padding:12px;border-radius:16px;background:var(--mint);color:#fff;font-weight:800;box-shadow:0 4px 0 #2AA582}.buy.no{background:#C9D1D8;box-shadow:0 4px 0 #A9B3BC}.buy small{font-size:.85rem}
#room{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;box-shadow:var(--sh);touch-action:none;user-select:none}
#room::before{content:"";position:absolute;left:0;right:0;top:56%;height:3%;background:rgba(255,255,255,.65)}
.pi{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:grab;touch-action:none;padding:2px}
.pi.bd{padding:.12em;font-size:inherit}
.pi.sel{outline:4px dashed var(--sky);outline-offset:4px;border-radius:14px}
#tools{display:flex;gap:8px;margin-top:10px;justify-content:center}
#tools button{padding:12px 16px;border-radius:16px;background:#fff;font-weight:800;box-shadow:var(--sh)}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tr{width:72px;height:72px;border-radius:18px;background:#fff;box-shadow:var(--sh);font-size:2rem;position:relative}.tr small{position:absolute;right:6px;bottom:2px;font-size:.8rem;font-weight:800}.tr.no{opacity:.35}
.sws{display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:800}.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:var(--sh)}.sw.on{outline:4px solid var(--sky)}
#toast{white-space:pre-line}
.dots b{align-self:center;font-weight:900}
.mb{display:block;width:100%;padding:16px 8px;margin-bottom:10px;border-radius:20px;background:#fff;box-shadow:0 5px 0 #CFD9E2;font-weight:800;font-size:1.6rem}
.mb:active{box-shadow:0 1px 0 #CFD9E2}.mb.on{outline:4px solid var(--sky)}.mb.ok{background:#CFF5E7;opacity:.6}.mb.ng{animation:shake .4s;background:#FFE3E3}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pic{grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.bx{background:#F1F8FF;border:3px solid #BFE3F7;border-radius:14px;padding:6px 2px;font-size:1rem;line-height:1.3}
.qrow{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:700;font-size:.95rem}
.qrow .bar{flex:1;margin:0;height:12px}.qrow .t{flex:1.6}.qrow .r{white-space:nowrap;font-weight:900;color:var(--org)}
.qrow.dn .t{text-decoration:line-through;opacity:.55}.qrow.dn .r{color:var(--mint)}
.wl{position:absolute;left:0;right:0;top:0;height:58%;z-index:0}.fl2{position:absolute;left:0;right:0;bottom:0;height:42%;z-index:0}
#room::before{z-index:1}
</style></head>
<body><div id="app">
<canvas id="fx"></canvas><div id="toast"></div>

<section id="home" class="screen on">
  <div class="hdr"><div class="mascot"><b></b><b></b><i></i><u></u><u></u><em></em><em></em><s></s></div>
    <div><h1>九九とっくんのへや</h1><p class="sub"><span id="nm">ゆうしゃ</span>さん、きょうも がんばろう！</p></div></div>
  <div class="chipR"><span class="sub">5のだんを ひたすら とっくん！</span><span class="coin">🪙 <span id="coin">0</span></span></div>
  <div class="card" style="margin-top:10px"><div class="lv"><span id="lvT">Lv.1</span><span id="expT">0 / 20</span></div><div class="bar"><div id="expB"></div></div></div>
  <button class="start" id="startBtn" onclick="show('pick')">きょうの しゅぎょうを はじめる<small id="startSub"></small></button>
  <div class="card" id="qpanel" style="margin-top:0"></div>
  <div class="two"><button style="background:var(--mint)" onclick="openShop()">🛍️ ショップ</button><button style="background:var(--sky)" onclick="openRoom()">🏠 じぶんのへや</button></div>
  
  <p class="tip">れんぞく 正かいの さいこう：<b id="bc">0</b> ／ せいかいした もんだい：<b id="tc">0</b></p>
</section>

<section id="quiz" class="screen">
  <div class="top"><button class="back" onclick="leave()">◀ やめる</button><div class="dots" id="dots"></div><div class="chip">⏱ <span id="tm">0</span></div></div>
  <div class="card q"><div class="combo" id="combo"></div>
    <div class="kana" id="kana"></div><div class="pic" id="pic" style="display:none"></div><div class="eq" id="eq"></div>
    <button class="spk" onclick="say(1)">🔊 もういちど きく</button>
    <div class="ans" id="ans"></div></div>
  <div class="pad" id="pad"></div>
</section>

<section id="pick" class="screen"><div class="top"><button class="back" onclick="goHome()">◀ もどる</button></div><div class="sec">れんしゅうを えらぼう</div><div id="modes"></div></section>
<section id="pf" class="screen"><div class="top"><button class="back" onclick="quit()">◀ やめる</button><div class="dots" id="pfd"></div></div>
  <div class="card q"><div class="kana">この こたえに なる しきは？</div><div class="eq" id="pfa"></div></div><div class="cols" id="pfc"></div></section>
<section id="mt" class="screen"><div class="top"><button class="back" onclick="quit()">◀ やめる</button></div>
  <div class="card q"><div class="kana">しきと こたえを むすぼう</div></div><div class="cols"><div id="ml"></div><div id="mr"></div></div></section>
<section id="listen" class="screen"><div class="top"><button class="back" onclick="quit()">◀ もどる</button></div>
  <div class="card q" onclick="lflip()"><div class="kana" id="lk"></div><div class="eq" id="lq"></div><div class="eq" id="la" style="color:var(--mint)"></div><p class="sub">タップで こたえ ／ 🔊で きく</p></div>
  <div class="two"><button style="background:var(--sky)" onclick="lnext(-1)">◀ まえ</button><button style="background:var(--org)" onclick="lnext(1)">つぎ ▶</button></div>
  <button class="btn alt" onclick="lsay(lShow?2:1)">🔊 もういちど きく</button></section>
<section id="shop" class="screen"><div class="top"><button class="back" onclick="goHome()">◀ もどる</button><span style="flex:1"></span><span class="coin">🪙 <span id="scoin"></span></span></div>
  <div class="sec">ショップ</div><div class="tabs" id="stabs"></div><div class="sgrid" id="sgrid"></div></section>
<section id="room-s" class="screen"><div class="top"><button class="back" onclick="goHome()">◀ もどる</button><span style="flex:1"></span><button class="back" onclick="openShop()">🛍️ ショップ</button></div>
  <div class="sec">じぶんのへや</div><div id="room"></div>
  <div id="tools"><button onclick="tool('s',.2)">➕ おおきく</button><button onclick="tool('s',-.2)">➖ ちいさく</button><button onclick="tool('del')">🧹 かたづける</button></div>
  <div class="tabs" id="rtabs"></div><div class="tray" id="rtray"></div>
  <div class="sws">かべ <span id="wl" class="sws" style="margin:0"></span></div><div class="sws">ゆか <span id="fl" class="sws" style="margin:0"></span></div></section>
<section id="result" class="screen"><div class="card res">
  <div class="chest" id="chest">🎁</div><h1 id="rtitle">クリア！</h1><p class="sub" id="rt"></p>
  <div class="big" id="rexp"></div><div class="coin" id="rcoin" style="display:inline-block;margin-top:8px"></div><p id="rrec" style="font-weight:800;color:var(--org);min-height:1.4em"></p>
  <button class="btn" id="again">もういちど</button><button class="btn alt" onclick="show('pick')">もどる</button></div></section>
</div>

const ITEMS=[];CATS.forEach((c,ci)=>c[1].split(',').forEach((s,i)=>{const [e,n,p]=s.split(' ');ITEMS.push({id:ci+'_'+i,e,n,p:Math.max(5,Math.round(+p*3/5)*5),c:ci,bd:c[0]=='バッジ'})}));
const byId=id=>ITEMS.find(i=>i.id==id);
const WALLS=[['ピンク','#FFE3EC',0],['そらいろ','#DDF1FF',60],['みどり','#E2F7E6',60],['きいろ','#FFF1C9',60],['むらさき','#EBE3FF',60],['しろ','#FFFFFF',60],['オレンジ','#FFD9C2',60],['ミント','#C9F0EC',60],
['ストライプ ピンク','repeating-linear-gradient(90deg,#FFE3EC 0 20px,#fff 20px 40px)',150],['ストライプ あお','repeating-linear-gradient(90deg,#DDF1FF 0 20px,#fff 20px 40px)',150],['もり','repeating-linear-gradient(90deg,#CDEBC8 0 18px,#E4F5DF 18px 36px)',150],['うみ','linear-gradient(#BFE9FF,#E8F8FF)',120],['ゆうやけ','linear-gradient(#FFD0A8,#FFE6CC)',120],['みずたま','radial-gradient(#FFB3C7 20%,transparent 21%) 0 0/28px 28px,#FFF0F5',200],['チェック','conic-gradient(#FFF3C4 25%,#fff 0 50%,#FFF3C4 0 75%,#fff 0) 0 0/40px 40px',200],['ほし','radial-gradient(#FFD23F 12%,transparent 13%) 0 0/34px 34px,#FFF9E0',250],['さくら','radial-gradient(#FFC0D6 14%,transparent 15%) 0 0/30px 30px,radial-gradient(#FFC0D6 14%,transparent 15%) 15px 15px/30px 30px,#FFF4F8',350],['にじ','linear-gradient(#FFD1D1,#FFE9C9,#FFFAC9,#D4F5D4,#D0E8FF,#E3D9FF)',400]].map(a=>({n:a[0],b:a[1],p:a[2]}));
const FLOORS=[['ウッド','#F0D2A6',0],['こげちゃ','#D8B08A',60],['みどり','#CBE5CE',60],['クリーム','#F7E8C8',60],['あお','#D5E0F0',60],['むらさき','#EAD5F0',60],['オレンジ','#E7C3A0',60],['みずいろ','#B9D9E8',60],
['チェック','conic-gradient(#fff 25%,#F2D7B8 0 50%,#fff 0 75%,#F2D7B8 0) 0 0/50px 50px',200],['ウッドばん','repeating-linear-gradient(90deg,#E9C48F 0 60px,#DDB27A 60px 62px)',150],['タイル','conic-gradient(#E6F0F8 25%,#fff 0 50%,#E6F0F8 0 75%,#fff 0) 0 0/50px 50px',180],['しばふ','repeating-linear-gradient(#BFE6B0 0 16px,#CDEEC0 16px 32px)',250],['ストライプ','repeating-linear-gradient(90deg,#FFD9E3 0 30px,#fff 30px 60px)',150],['にじ','linear-gradient(90deg,#FFD1D1,#FFE9C9,#FFFAC9,#D4F5D4,#D0E8FF,#E3D9FF)',400]].map(a=>({n:a[0],b:a[1],p:a[2]}));
let shopC=0,roomC=0,sel=null,drag=null;
const placed=id=>S.room.items.filter(o=>o.id==id).length;
function tabs(el,cur,fn,all){$(el).innerHTML=CATS.map(c=>c[0]).concat(all?['かべがみ','ゆか']:[]).map((n,i)=>`<button class="tab ${i==cur?'on':''}" onclick="${fn}(${i})">${n}</button>`).join('')}
function openShop(){show('shop');drawShop()}
function setShop(i){shopC=i;drawShop()}
function drawShop(){tabs('stabs',shopC,'setShop',1);$('scoin').textContent=S.coins;
  if(shopC>=CATS.length){$('sgrid').innerHTML=themeShop(shopC==CATS.length?'wall':'floor');return}
  $('sgrid').innerHTML=ITEMS.filter(i=>i.c==shopC).map(i=>{const o=S.owned[i.id]||0,ok=S.coins>=i.p;
    return `<div class="it ${i.bd?'bd':''}"><div class="em">${i.e}</div><b>${i.n}</b><span>${o?'もってる ×'+o:'まだ ない'}</span><button class="buy ${ok?'':'no'}" onclick="buy('${i.id}')">🪙 ${i.p} ${ok?'かう':'<small>あと '+(i.p-S.coins)+'</small>'}</button></div>`}).join('')}
function buy(id){const i=byId(id);if(!i)return;if(S.coins<i.p){sNG();toast('コインが たりないよ\nあと '+(i.p-S.coins)+' 🪙');return}
  S.coins-=i.p;S.owned[id]=(S.owned[id]||0)+1;save();sOK();burst(14);toast(i.e+' ゲット！\nへやに かざろう');drawShop()}
function openRoom(){sel=null;show('room-s');drawRoom()}
function setRoom(i){roomC=i;drawRoom()}
function drawRoom(){const R=S.room,rm=$('room'),w=rm.clientWidth||320;
  rm.innerHTML=`<div class="wl" style="background:${(WALLS[R.wall]||WALLS[0]).b}"></div><div class="fl2" style="background:${(FLOORS[R.floor]||FLOORS[0]).b}"></div>`+R.items.map(o=>{const i=byId(o.id);return i?`<div class="pi ${i.bd?'bd':''} ${o.u==sel?'sel':''}" data-u="${o.u}" style="left:${o.x*100}%;top:${o.y*100}%;font-size:${Math.round(w*.12*o.s)}px;z-index:${Math.round(o.y*100)}">${i.e}</div>`:''}).join('');
  $('tools').style.visibility=sel?'visible':'hidden';tabs('rtabs',roomC,'setRoom');
  $('rtray').innerHTML=ITEMS.filter(i=>i.c==roomC&&S.owned[i.id]).map(i=>{const r=S.owned[i.id]-placed(i.id);return `<button class="tr ${r>0?'':'no'}" onclick="put('${i.id}')">${i.e}<small>×${r}</small></button>`}).join('')||'<p class="tip">ショップで かざりを かおう！</p>';
  $('wl').innerHTML=WALLS.map((t,i)=>S.themes.wall.includes(i)?`<button class="sw ${i==R.wall?'on':''}" style="background:${t.b}" onclick="theme('wall',${i})"></button>`:'').join('');
  $('fl').innerHTML=FLOORS.map((t,i)=>S.themes.floor.includes(i)?`<button class="sw ${i==R.floor?'on':''}" style="background:${t.b}" onclick="theme('floor',${i})"></button>`:'').join('')}
function theme(k,i){if(!S.themes[k].includes(i))return;S.room[k]=i;save();drawRoom()}
function themeShop(k){const L=k=='wall'?WALLS:FLOORS,own=S.themes[k];return L.map((t,i)=>{const o=own.includes(i),ok=S.coins>=t.p;
  return `<div class="it"><div style="height:64px;border-radius:14px;margin-bottom:6px;box-shadow:inset 0 0 0 3px #fff,var(--sh);background:${t.b}"></div><b>${t.n}</b><span>${o?'もってる ✓':'まだ ない'}</span>${o?'':`<button class="buy ${ok?'':'no'}" onclick="buyTheme('${k}',${i})">🪙 ${t.p} ${ok?'かう':'<small>あと '+(t.p-S.coins)+'</small>'}</button>`}</div>`}).join('')}
function buyTheme(k,i){const t=(k=='wall'?WALLS:FLOORS)[i];if(!t||S.themes[k].includes(i))return;
  if(S.coins<t.p){sNG();toast('コインが たりないよ\nあと '+(t.p-S.coins)+' 🪙');return}
  S.coins-=t.p;S.themes[k].push(i);save();sOK();burst(14);toast('🎨 '+t.n+' ゲット！\nへやで えらぼう');drawShop()}
function put(id){const R=S.room;if(placed(id)>=(S.owned[id]||0)){toast('ぜんぶ おいてるよ！\nショップで かおう');return}
  if(R.items.length>=80){toast('へやが いっぱい！');return}
  R.n++;R.items.push({u:R.n,id,x:.3+Math.random()*.4,y:.45+Math.random()*.4,s:1});sel=R.n;save();drawRoom()}
function tool(a,d){const R=S.room,o=R.items.find(o=>o.u==sel);if(!o)return;
  if(a=='del'){R.items=R.items.filter(x=>x!=o);sel=null}else o.s=Math.min(2.4,Math.max(.6,Math.round((o.s+d)*10)/10));save();drawRoom()}
(function(){const rm=$('room');
  rm.addEventListener('pointerdown',e=>{const t=e.target.closest('.pi');sel=t?+t.dataset.u:null;drag=t?S.room.items.find(o=>o.u==sel):null;drawRoom();if(drag){try{rm.setPointerCapture(e.pointerId)}catch(x){}}});
  rm.addEventListener('pointermove',e=>{if(!drag)return;const r=rm.getBoundingClientRect();
    drag.x=Math.min(.95,Math.max(.05,(e.clientX-r.left)/r.width));drag.y=Math.min(.95,Math.max(.08,(e.clientY-r.top)/r.height));
    const el=rm.querySelector(`[data-u="${drag.u}"]`);if(el){el.style.left=drag.x*100+'%';el.style.top=drag.y*100+'%';el.style.zIndex=Math.round(drag.y*100)}});
  const up=()=>{if(drag){drag=null;save()}};rm.addEventListener('pointerup',up);rm.addEventListener('pointercancel',up);
  addEventListener('resize',()=>{if($('room-s').classList.contains('on'))drawRoom()})})();
render();
</script></body></html>
